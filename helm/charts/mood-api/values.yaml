replicaCount: 2

image:
  repository: 975050024946.dkr.ecr.eu-central-1.amazonaws.com/capstone-g3-gratitude/moods-api #975050024946.dkr.ecr.eu-central-1.amazonaws.com/vijay-shopnow/backend
  tag: v1.0.0-vijay
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5002


hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  path: /api/moods123/?(.*)
  pathType: ImplementationSpecific
  host: ""                      # optional host; leave blank for path-only routing
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  ingressClassName: nginx
