replicaCount: 2

image:
  repository: 975050024946.dkr.ecr.eu-central-1.amazonaws.com/capstone-g3-gratitude/api-gateway
  tag: v1.0.0-vijay
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000


hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  path_1: /api/journal/?(.*)
  path_2: /api/(ai/?.*)
  path_3: /api/entries/?(.*)
  pathType: ImplementationSpecific
  host: ""                      # optional host; leave blank for path-only routing
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  ingressClassName: nginx
