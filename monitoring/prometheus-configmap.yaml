apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: /prometheus/metrics

      - job_name: 'web-app'
        static_configs:
          - targets: ['web-app-service:80']

      - job_name: 'node'
        static_configs:
          - targets: ['node-exporter:9100']