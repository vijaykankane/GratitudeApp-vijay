apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    
    root_url = %(protocol)s://%(domain)s/grafana/
    serve_from_sub_path = true
    enforce_domain = false

    [database]
    type = sqlite3

    [security]
    admin_user = admin
    admin_password = admin

    [users]
    allow_sign_up = false

    [auth.anonymous]
    enabled = false